plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketdoombuilder'
    compileSdk 35

    defaultConfig {
        applicationId "com.pocketdoombuilder"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17"
            }
        }
        ndk {
            // 64-bit only: level data for large maps needs the memory.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        // The icon PNGs and fonts are read directly from assets.
        noCompress 'png', 'ttf', 'txt'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
}
