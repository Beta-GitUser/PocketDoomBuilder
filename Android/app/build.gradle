plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Signing
//
// Every build used to be signed with the throwaway debug key that Gradle
// generates inside the Actions runner. That key does not exist anywhere else,
// so its fingerprint changed from run to run and Android refused to install a
// new build over an old one ("app not installed"), forcing an uninstall - which
// also wipes the app's data and settings - before every update.
//
// A real key fixes that. It is read, in order, from:
//   1. app/keystore.properties  (git-ignored; for local builds in Termux)
//   2. the environment: PDB_KEYSTORE / PDB_KEYSTORE_PASSWORD / PDB_KEY_ALIAS /
//      PDB_KEY_PASSWORD, with the keystore itself decoded from PDB_KEYSTORE_BASE64
//      (how CI receives it from the repository secrets)
// If neither is present the build falls back to the debug key exactly as before,
// so a fork without secrets still builds.
// ---------------------------------------------------------------------------
def signingProps = new Properties()
def signingFile = rootProject.file('app/keystore.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}
def envOrProp = { String envName, String propName ->
    System.getenv(envName) ?: signingProps.getProperty(propName)
}
def releaseStoreFile = envOrProp('PDB_KEYSTORE', 'storeFile')
def releaseStorePassword = envOrProp('PDB_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = envOrProp('PDB_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = envOrProp('PDB_KEY_PASSWORD', 'keyPassword')
def hasReleaseKey = releaseStoreFile && releaseStorePassword && releaseKeyAlias &&
        releaseKeyPassword

android {
    namespace 'com.pocketdoombuilder'
    compileSdk 35
    // Pinned so Gradle downloads the exact NDK the CI workflow installs.
    // (Google only ships x64 host builds of the NDK, hence the GitHub Actions
    // build for arm64-only workstations.)
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId "com.pocketdoombuilder"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                // -std=c++17 is also set in CMakeLists.txt; repeating it here
                // keeps the flag in the per-ABI compile commands that AGP
                // hands to the IDE. (The STL is left at AGP's default: nothing
                // in the port throws or uses RTTI, so no libc++_shared.so
                // needs to ship in the APK.)
                cppFlags "-std=c++17"
            }
        }
        ndk {
            // 64-bit by default: large maps need the address space. The CI
            // workflow can rewrite this line via Android/tools/set_abis.py.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        // Only created when a key is actually configured: declaring a config
        // with a missing storeFile breaks even the debug build.
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // v2 + v3: what Android 7+ and 9+ check. v1 is not needed at
                // minSdk 24 and just bloats the APK.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // Signed with your own key when one is configured (see the top of
            // this file); otherwise with the debug key so a manual CI build
            // still produces an installable APK.
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
            // Same key as release when one is configured: debug and release
            // APKs then share a signature, so one can replace the other on the
            // phone without an uninstall.
            if (hasReleaseKey) {
                signingConfig = signingConfigs.release
            }
            // Debug builds are what CI ships, and they were *not* optimised:
            // the native library ran at -O0, which made startup work (decoding
            // 295 PNGs, packing the atlas) about 20x slower than it needs to
            // be - 30 s of black screen on a Mali-G52. -O2 plus a sane
            // re-optimisation of what optimises cleanly fixes that while
            // keeping the build debuggable and unstripped (the hang watchdog
            // needs symbols).
            externalNativeBuild {
                cmake {
                    cppFlags "-std=c++17 -O2"
                }
            }
            packagingOptions {
                jniLibs {
                    keepDebugSymbols += '**/*.so'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // The icon PNGs and fonts are read straight out of the asset manager,
        // so keep them uncompressed. (Method form: `noCompress += [...]` would
        // need a setter that the AndroidResources DSL does not expose.)
        noCompress 'png', 'ttf', 'txt'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
}
