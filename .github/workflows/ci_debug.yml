name: CI debug log

# Temporary: re-runs the host checks and publishes the raw log to the
# "ci-logs" branch so it can be read with plain git.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ci_debug.yml'

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Checks
        run: |
          set -o pipefail
          sh Android/tests/run_tests.sh --preview > /tmp/log.txt 2>&1 || echo "EXIT=$?" >> /tmp/log.txt
          cat /tmp/log.txt
          { echo "which g++: $(which g++ 2>&1)"; g++ --version 2>&1 | head -2; echo "sh -> $(readlink -f /bin/sh)"; } >> /tmp/log.txt
          cat /tmp/log.txt >> "$GITHUB_STEP_SUMMARY"
          git config user.name ci-logs
          git config user.email ci-logs@example.com
          git checkout -q -B ci-logs
          cp /tmp/log.txt ci-log.txt
          git add ci-log.txt
          git commit -q -m "CI log $(date -u +%FT%TZ) ${GITHUB_SHA:0:7}" || true
          git push -q -f origin ci-logs
