name: CI debug log

# Temporary: runs the host checks and republishes the tail of the log as
# check-run annotations, which can be read through the API (the Actions log
# viewer host is not reachable from every client).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ci_debug.yml'

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Checks
        run: |
          set -o pipefail
          {
            echo "g++: $(g++ --version | head -1)"
            echo "sh: $(readlink -f /bin/sh)"
          } > /tmp/log.txt
          sh Android/tests/run_tests.sh --preview >> /tmp/log.txt 2>&1 || echo "EXIT=$?" >> /tmp/log.txt
          cat /tmp/log.txt
          # Emit the tail as one annotation: %0A is a newline, %25 a literal %.
          MSG=$(tail -n 40 /tmp/log.txt | sed 's/%/%25/g')
          printf '::error file=ci-log.txt,title=host+checks+log::%s%%0A' "$(echo "$MSG" | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "done"
