name: Godot Spike

on:
  push:
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-spike.yml'
  pull_request:
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-spike.yml'
  workflow_dispatch:

jobs:
  gdextension-headless:
    name: Build GDExtension + headless test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Download Godot 4.7.2-stable (Linux x86_64)
        run: |
          GODOT_VERSION="4.7.2-stable"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p godot-bin
          curl -L "$GODOT_URL" -o godot.zip
          unzip -o godot.zip -d godot-bin
          chmod +x godot-bin/*
          ./godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 --version

      - name: Generate test WAD
        run: |
          python3 Godot/ext/gen_test_wad.py Godot/project-name/test_data/test.wad

      - name: Build GDExtension
        run: |
          sh Godot/ext/build.sh Godot/ext/pd_core.so
          ls -la Godot/ext/pd_core.so

      - name: Run headless spike test
        working-directory: Godot/project-name
        run: |
          ../godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://test_spike.gd
