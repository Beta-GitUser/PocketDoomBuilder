name: Godot Spike

on:
  push:
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-spike.yml'
  pull_request:
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-spike.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gdextension:
    name: Build GDExtension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Download Godot 4.7.2-stable (Linux x86_64)
        run: |
          GODOT_VERSION="4.7.2-stable"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p godot-bin
          curl -L "$GODOT_URL" -o godot.zip
          unzip -o godot.zip -d godot-bin
          chmod +x godot-bin/*
          ./godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 --version

      - name: Generate test WAD
        run: |
          python3 Godot/project-name/ext/gen_test_wad.py Godot/project-name/test_data/test.wad

      - name: Build GDExtension
        run: |
          sh Godot/project-name/ext/build.sh Godot/project-name/ext/pd_core.so
          ls -la Godot/project-name/ext/pd_core.so
          # Sanity-check the entry symbol is exported.
          nm -D Godot/project-name/ext/pd_core.so | grep pd_core_extension_init

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gdextension-build
          path: |
            Godot/project-name/ext/pd_core.so
            Godot/project-name/test_data/test.wad
            godot-bin/

  headless-test:
    name: Headless spike test
    needs: build-gdextension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gdextension-build
          path: .

      - name: Restore build layout
        run: |
          # download-artifact@v4 with path: . extracts files preserving their
          # original directory structure, so the .so and test.wad land in
          # place automatically. Just make the Godot binary executable.
          chmod +x godot-bin/*
          ls -la Godot/project-name/ext/pd_core.so Godot/project-name/test_data/test.wad godot-bin/

      - name: Run headless spike test
        working-directory: Godot/project-name
        run: |
          LOG=spike_test.log
          ../../godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://test_spike.gd 2>&1 | tee "$LOG"
          exit ${PIPESTATUS[0]}

      - name: Upload test log on failure
        if: failure()
        working-directory: Godot/project-name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "=== spike_test.log ==="
          cat spike_test.log
          # Commit the log to the triggering branch so it can be read via
          # the API (the CI log host is unreachable from the sandbox).
          curl --fail -sS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/Godot/project-name/spike_test.log?ref=${{ github.ref_name }}" \
            -d "{\"message\":\"CI diagnostics: spike test log\",\"content\":\"$(base64 -w0 spike_test.log)\"}"
