name: Godot Spike

on:
  push:
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-spike.yml'
  pull_request:
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-spike.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  headless-test:
    name: Headless GDScript spike test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Download Godot 4.7.2-stable (Linux x86_64)
        run: |
          GODOT_VERSION="4.7.2-stable"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p godot-bin
          curl -L "$GODOT_URL" -o godot.zip
          unzip -o godot.zip -d godot-bin
          chmod +x godot-bin/*
          ./godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 --version

      - name: Generate test WAD
        run: |
          python3 Godot/project-name/test_data/gen_test_wad.py Godot/project-name/test_data/test.wad

      - name: Run headless spike test
        working-directory: Godot/project-name
        run: |
          LOG=spike_test.log
          ../../godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://test_spike.gd 2>&1 | tee "$LOG"
          exit ${PIPESTATUS[0]}

      - name: Upload test log on failure
        if: failure()
        working-directory: Godot/project-name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "=== spike_test.log ==="
          cat spike_test.log
          # Commit the log to the triggering branch so it can be read via
          # the API (the CI log host is unreachable from the sandbox).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spike_test.log
          git commit -m "CI diagnostics: spike test log" || echo "no changes to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"
