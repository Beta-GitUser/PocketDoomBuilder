name: Godot Spike

on:
  push:
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-spike.yml'
  pull_request:
    paths:
      - 'Godot/**'
      - '.github/workflows/godot-spike.yml'
  workflow_dispatch:

jobs:
  build-gdextension:
    name: Build GDExtension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Download Godot 4.7.2-stable (Linux x86_64)
        run: |
          GODOT_VERSION="4.7.2-stable"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p godot-bin
          curl -L "$GODOT_URL" -o godot.zip
          unzip -o godot.zip -d godot-bin
          chmod +x godot-bin/*
          ./godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 --version

      - name: Generate test WAD
        run: |
          python3 Godot/ext/gen_test_wad.py Godot/project-name/test_data/test.wad

      - name: Build GDExtension
        run: |
          sh Godot/ext/build.sh Godot/ext/pd_core.so
          ls -la Godot/ext/pd_core.so
          # Sanity-check the entry symbol is exported.
          nm -D Godot/ext/pd_core.so | grep pd_core_extension_init

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gdextension-build
          path: |
            Godot/ext/pd_core.so
            Godot/project-name/test_data/test.wad
            godot-bin/

  headless-test:
    name: Headless spike test
    needs: build-gdextension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: gdextension-build
          path: .

      - name: Restore build layout
        run: |
          # Artifacts land in subdirectories named after their original paths.
          cp -v gdextension-build/Godot/ext/pd_core.so Godot/ext/pd_core.so
          cp -v gdextension-build/Godot/project-name/test_data/test.wad Godot/project-name/test_data/test.wad
          mkdir -p godot-bin
          cp -v gdextension-build/godot-bin/* godot-bin/
          chmod +x godot-bin/*
          ls -la Godot/ext/pd_core.so Godot/project-name/test_data/test.wad godot-bin/

      - name: Run headless spike test
        working-directory: Godot/project-name
        run: |
          ../godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://test_spike.gd
